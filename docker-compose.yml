services:
  db:
    image: ankane/pgvector:latest
    container_name: chatagent-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: chatagent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatagent"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
